<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Codex 额度</title>
<style>
  :root { color-scheme:light; --bg:#fff; --fg:#263245; --muted:#637083; --line:#e8edf3; --track:#edf1f6; --accent:#3768c5; --soft:#f5f7fa; --warn:#96600e; --warn-bg:#fff7e9; --danger:#b53c43; --focus:#3768c5; font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#20242b; --fg:#e6ebf3; --muted:#a8b3c3; --line:#343c49; --track:#343c49; --accent:#83a9f0; --soft:#2a303a; --warn:#efbe69; --warn-bg:#3c3223; --danger:#f28d95; --focus:#9fc0ff; } }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#20242b; --fg:#e6ebf3; --muted:#a8b3c3; --line:#343c49; --track:#343c49; --accent:#83a9f0; --soft:#2a303a; --warn:#efbe69; --warn-bg:#3c3223; --danger:#f28d95; --focus:#9fc0ff; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--fg); } button { font:inherit; }
  main { max-width:720px; padding:24px; margin:auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:27px; }
  h1 { margin:0; font-size:19px; line-height:1.3; font-weight:650; letter-spacing:-.25px; }
  .subtitle { margin:5px 0 0; color:var(--muted); font-size:12px; }
  button { display:inline-flex; gap:7px; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); min-height:36px; padding:6px 11px; cursor:pointer; flex-shrink:0; }
  button:hover { background:var(--soft); } button:focus-visible { outline:2px solid var(--focus); outline-offset:3px; } button:disabled { cursor:wait; opacity:.65; }
  .refresh-icon { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .bucket + .bucket { border-top:1px solid var(--line); margin-top:25px; padding-top:21px; }
  h2 { font-size:12px; font-weight:600; margin:0 0 14px; color:var(--muted); overflow-wrap:anywhere; }
  .window + .window { margin-top:23px; }
  .row { display:flex; align-items:baseline; gap:15px; justify-content:space-between; margin-bottom:9px; }
  .window-label { font-size:14px; font-weight:550; overflow-wrap:anywhere; }
  .value { white-space:nowrap; font-variant-numeric:tabular-nums; font-size:25px; line-height:1.1; font-weight:600; letter-spacing:-.7px; }
  .value small { font-size:12px; font-weight:400; letter-spacing:0; color:var(--muted); margin-right:7px; }
  .track { height:6px; border-radius:3px; overflow:hidden; background:var(--track); } .fill { height:100%; background:var(--accent); border-radius:3px; } .low .fill { background:var(--warn); } .empty .fill { background:var(--danger); }
  .reset { color:var(--muted); font-size:12px; margin:8px 0 0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .message { margin:0 0 20px; padding:10px 12px; background:var(--warn-bg); color:var(--warn); border-radius:7px; font-size:12px; overflow-wrap:anywhere; }
  .message[hidden] { display:none; } .empty-state { padding:24px 0 28px; color:var(--muted); } .empty-state strong { display:block; font-weight:550; font-size:15px; color:var(--fg); margin-bottom:6px; } .empty-state p { margin:0; font-size:13px; }
  footer { border-top:1px solid var(--line); padding-top:15px; margin-top:25px; color:var(--muted); display:flex; gap:8px 15px; justify-content:space-between; flex-wrap:wrap; font-size:11px; }
  @media(max-width:360px) { main { padding:18px 16px; } header { margin-bottom:22px; } .value { font-size:23px; } }
  @media(prefers-reduced-motion:no-preference) { button:disabled .refresh-icon { animation:turn 1.1s linear infinite; } @keyframes turn { to { transform:rotate(360deg); } } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Codex 额度</h1><p class="subtitle">账户共享额度</p></div>
    <button id="refresh" type="button" aria-label="刷新额度"><svg class="refresh-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 5.5A5.3 5.3 0 1 0 13.2 10M13 2v3.5H9.5"/></svg><span id="refresh-label">刷新</span></button>
  </header>
  <p id="message" class="message" role="status" hidden></p>
  <section id="quotas" aria-label="额度窗口"><div class="empty-state"><strong>正在读取额度</strong><p>稍候，数据将自动显示。</p></div></section>
  <footer><span id="updated">尚未更新</span><span id="auto-state">每分钟自动刷新</span></footer>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const pending = new Map();
  let requestId = 1, ready = false, destroyed = false, busy = false, lastData = null, lastAttempt = 0, timer, resizeObserver;
  let hostContext = {};
  const finite = value => typeof value === 'number' && Number.isFinite(value);
  const percent = value => finite(value) ? Math.max(0,Math.min(100,value)) : null;
  const el = (tag, className, text) => { const node=document.createElement(tag); if(className)node.className=className; if(text !== undefined)node.textContent=String(text); return node; };
  const parseDate = value => { if(value===null || value===undefined || value==='')return null; const d=new Date(typeof value==='number' ? value*1000 : value); return Number.isFinite(d.getTime())?d:null; };
  const timeFmt = new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const dateFmt = new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  function resetText(value) { const d=parseDate(value); if(!d)return '重置时间暂不可用'; if(d.getTime()<=Date.now())return '已到重置时间，等待刷新'; const minutes=Math.ceil((d.getTime()-Date.now())/60000); const span=minutes>=1440 ? `${Math.floor(minutes/1440)} 天 ${Math.floor(minutes%1440/60)} 小时` : minutes>=60 ? `${Math.floor(minutes/60)} 小时 ${minutes%60} 分钟` : `${minutes} 分钟`; return `${span}后重置（${dateFmt.format(d)}）`; }
  function windowLabel(w) { if(w.label)return String(w.label); const duration=w.windowDurationMins ?? w.durationMinutes; if(!finite(duration))return w.id==='secondary'?'长期额度':'当前额度'; if(duration===10080)return '每周额度'; if(duration%1440===0)return `${duration/1440} 天额度`; if(duration%60===0)return `${duration/60} 小时额度`; return `${duration} 分钟额度`; }
  function showMessage(message) { $('message').textContent=message || ''; $('message').hidden=!message; }
  function empty(title, text) { const node=el('div','empty-state'); node.append(el('strong','',title),el('p','',text)); $('quotas').replaceChildren(node); }
  function stale(data) { const d=parseDate(data?.fetchedAt); return data?.stale===true || (d && Date.now()-d.getTime()>150000); }
  function updateFooter() { const d=parseDate(lastData?.fetchedAt); $('updated').textContent=d ? `更新于 ${timeFmt.format(d)}${stale(lastData)?' · 数据待更新':''}` : '尚未更新'; $('auto-state').textContent=document.hidden?'已暂停自动刷新':'每分钟自动刷新'; }
  function render(data) {
    if(!data || typeof data!=='object') { showMessage('未收到有效数据，请重试。'); return; }
    if(data.status==='error') { const msg=typeof data.error?.message==='string'?data.error.message:'读取失败，请检查 Codex 登录状态后重试。'; showMessage(lastData?`刷新失败，显示上次数据。${msg}`:msg); if(!lastData)empty('暂时无法读取额度','检查 Codex 登录状态后，点击刷新。'); updateFooter(); return; }
    lastData=data;
    const buckets=Array.isArray(data.buckets)?data.buckets:[];
    const fragment=document.createDocumentFragment(); let count=0;
    buckets.forEach(bucket=>{
      const section=el('section','bucket');
      const windows=Array.isArray(bucket.windows)?bucket.windows:[];
      if(buckets.length>1 || bucket.label || bucket.name) section.append(el('h2','',bucket.label||bucket.name||bucket.limitId||bucket.id||'Codex'));
      windows.forEach(w=>{
        const remaining=percent(w.remainingPercent);
        const wrap=el('div',`window${remaining!==null && remaining<=20?' low':''}${remaining===0?' empty':''}`);
        const row=el('div','row'); row.append(el('span','window-label',windowLabel(w)));
        const value=el('span','value'); value.append(el('small','', '剩余'),document.createTextNode(remaining===null?'—':`${Number(remaining.toFixed(1))}%`)); row.append(value);
        const track=el('div','track'); const fill=el('div','fill'); fill.style.width=remaining===null?'0%':`${remaining}%`; track.append(fill);
        if(remaining!==null) { track.setAttribute('role','meter'); track.setAttribute('aria-label',`${windowLabel(w)}剩余额度`); track.setAttribute('aria-valuemin','0'); track.setAttribute('aria-valuemax','100'); track.setAttribute('aria-valuenow',String(remaining)); }
        else track.setAttribute('aria-label','额度暂不可用');
        wrap.append(row,track,el('p','reset',resetText(w.resetsAt ?? w.resetAt))); section.append(wrap); count++;
      });
      if(windows.length)fragment.append(section);
    });
    if(count)$('quotas').replaceChildren(fragment); else empty('暂时没有额度数据','当前账户尚未返回可显示的额度窗口。');
    showMessage(stale(data)?'当前为上次读取的数据，正在等待更新。':'');
    updateFooter();
  }
  function notify(method, params={}) { if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',method,params},'*'); }
  function request(method,params,timeout=35000) { return new Promise((resolve,reject)=>{ if(window.parent===window){reject(new Error('请在 Codex 内打开额度插件。'));return;} const id=requestId++; const timeoutId=setTimeout(()=>{pending.delete(id);reject(new Error('连接超时，请稍后重试。'));},timeout); pending.set(id,{resolve,reject,timeoutId}); window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*'); }); }
  function applyHostContext(context) { hostContext={...hostContext,...context}; if(['light','dark'].includes(hostContext.theme))document.documentElement.dataset.theme=hostContext.theme; }
  function acceptResult(result) { if(result?.structuredContent)render(result.structuredContent); else if(result && typeof result==='object' && ('buckets' in result || 'status' in result))render(result); else if(result?.isError)render({status:'error',error:{message:'额度读取失败，请稍后刷新。'}}); else showMessage('未收到有效数据，请重试。'); }
  async function refresh() { if(busy || destroyed)return; busy=true; lastAttempt=Date.now(); $('refresh').disabled=true; $('refresh-label').textContent='刷新中'; try { const result=ready ? await request('tools/call',{name:'get_quota',arguments:{}}) : typeof window.openai?.callTool==='function' ? await Promise.race([window.openai.callTool('get_quota',{}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('读取超时，请重试。')),35000))]) : await request('tools/call',{name:'get_quota',arguments:{}}); acceptResult(result); } catch(err) { render({status:'error',error:{message:err?.message||'刷新失败，请稍后重试。'}}); } finally { busy=false; $('refresh').disabled=false; $('refresh-label').textContent='刷新'; } }
  function teardown() { destroyed=true; clearInterval(timer); resizeObserver?.disconnect(); for(const p of pending.values()){clearTimeout(p.timeoutId);p.reject(new Error('面板已关闭'));}pending.clear(); }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent || window.parent===window)return;
    const m=event.data; if(!m || m.jsonrpc!=='2.0')return;
    if(m.id!==undefined && pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timeoutId);m.error?p.reject(new Error(typeof m.error.message==='string'?m.error.message:'请求失败')):p.resolve(m.result);return;}
    if(m.method==='ui/notifications/tool-result')acceptResult(m.params);
    else if(m.method==='ui/notifications/host-context-changed')applyHostContext(m.params||{});
    else if(m.method==='ui/notifications/tool-cancelled')showMessage('读取已取消，可以点击刷新重试。');
    else if(m.method==='ping' && m.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');
    else if(m.method==='ui/resource-teardown'){teardown();if(m.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');}
  });
  window.addEventListener('openai:set_globals',event=>{const g=event.detail?.globals||{};if(g.theme)applyHostContext({theme:g.theme});if(g.toolOutput)acceptResult(g.toolOutput);});
  $('refresh').addEventListener('click',refresh);
  document.addEventListener('visibilitychange',()=>{updateFooter();if(!document.hidden && Date.now()-lastAttempt>=60000 && (ready || window.openai?.callTool))refresh();});
  window.addEventListener('pagehide',teardown);
  timer=setInterval(()=>{updateFooter();if(!document.hidden && (ready || window.openai?.callTool))refresh();},60000);
  window.QuotaCard=Object.freeze({render,refresh,resetText,windowLabel});
  (async()=>{
    if(window.openai?.theme)applyHostContext({theme:window.openai.theme});
    if(window.openai?.toolOutput)acceptResult(window.openai.toolOutput);
    if(window.parent===window && !window.openai?.callTool){empty('请在 Codex 内打开','选择“额度”插件，或在对话中说“显示额度”。');$('auto-state').textContent='等待应用连接';return;}
    try { const result=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'quota-lite',version:'1.0.4'},appCapabilities:{availableDisplayModes:['inline','fullscreen','pip']}},8000); ready=true; applyHostContext(result?.hostContext||{}); notify('ui/notifications/initialized'); if(typeof ResizeObserver!=='undefined'){resizeObserver=new ResizeObserver(()=>notify('ui/notifications/size-changed',{height:document.querySelector('main').getBoundingClientRect().height}));resizeObserver.observe(document.querySelector('main'));} if(!lastData)await refresh(); }
    catch { if(window.openai?.callTool){if(!lastData)await refresh();}else if(!lastData){empty('暂时无法连接额度插件','请重新打开插件，或在对话中说“显示额度”。');showMessage('应用连接未完成，请稍后重试。');} }
  })();
})();
</script>
</body>
</html>
